<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header">
          Manage Certificate
        </div>
        <div class="card-body">
          <div class="text-center mb-4">
            <p>Please select your Environment to proceed</p>
          </div>

          <div class="row mb-3">
            <div class="col-md-12 d-flex justify-content-center">
              <mat-radio-group aria-label="Select an option">
                <mat-radio-button value="dev">DEV</mat-radio-button>
                <mat-radio-button value="uat">UAT</mat-radio-button>
                <mat-radio-button value="prod">PROD</mat-radio-button>
              </mat-radio-group>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-12">
              <mat-form-field appearance="fill" style="width: 100%;">
                <mat-label for="csi">CSI</mat-label>
                <input matInput type="text" id="csi" value="169073">
              </mat-form-field>
            </div>
          </div>

          <div class="d-flex justify-content-center">
            <button mat-raised-button color="primary">Submit</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
