<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header">
          Onboard Certificate
        </div>
        <div class="card-body">
          <form>
            <div class="mb-3">
              <label for="csi" class="form-label">CSI</label>
              <input type="text" class="form-control" id="csi" value="169073">
            </div>

            <div class="mb-3">
              <label class="form-label">Environment</label>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="environment" id="dev" value="dev" checked>
                <label class="form-check-label" for="dev">DEV</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="environment" id="uat" value="uat">
                <label class="form-check-label" for="uat">UAT</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="environment" id="prod" value="prod">
                <label class="form-check-label" for="prod">PROD</label>
              </div>
            </div>

            <div class="mb-3">
              <label for="index" class="form-label">Index (Optional not recommended)</label>
              <input type="text" class="form-control" id="index" placeholder="example: swdmsdev1">
            </div>

            <div class="mb-3">
              <label for="secretName" class="form-label">Secret Name</label>
              <input type="text" class="form-control" id="secretName" value="testcertv1">
            </div>

            <div class="mb-3">
              <label for="applicationNames" class="form-label">Application Names</label>
              <input type="text" class="form-control" id="applicationNames" value="app1, app2, app3">
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" value="****">
            </div>

            <div class="mb-3">
              <label for="certificate" class="form-label">Certificate</label>
              <input type="file" class="form-control" id="certificate">
            </div>

            <div class="mb-3">
              <label for="privateKey" class="form-label">Private Key</label>
              <input type="file" class="form-control" id="privateKey">
            </div>

            <div class="mb-3">
              <label class="form-label">Select CA Certificate(s)</label>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="caCertificate" id="caDev" value="dev" checked>
                <label class="form-check-label" for="caDev">DEV</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="caCertificate" id="caUat" value="uat">
                <label class="form-check-label" for="caUat">UAT</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="caCertificate" id="caProd" value="prod">
                <label class="form-check-label" for="caProd">PROD</label>
              </div>
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
