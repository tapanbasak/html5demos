<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-10">  <div class="card">
        <div class="card-header">
          Onboard Certificate
        </div>
        <div class="card-body">
          <form>
            <div class="row mb-3">
              <div class="col-md-4">
                <mat-form-field appearance="outline" style="width: 100%;">
                  <mat-label for="csi">CSI</mat-label>
                  <input matInput type="text" id="csi" value="169073">
                </mat-form-field>
              </div>
              <div class="col-md-4">
                <label class="form-label">Environment</label>
                <mat-radio-group aria-label="Select an option">
                  <mat-radio-button value="dev" checked>DEV</mat-radio-button>
                  <mat-radio-button value="uat">UAT</mat-radio-button>
                  <mat-radio-button value="prod">PROD</mat-radio-button>
                </mat-radio-group>
              </div>
              <div class="col-md-4">
                <mat-form-field appearance="outline" style="width: 100%;">
                  <mat-label for="index">Index (Optional not recommended)</mat-label>
                  <input matInput type="text" id="index" placeholder="example: swdmsdev1">
                </mat-form-field>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-4">
                <mat-form-field appearance="outline" style="width: 100%;">
                  <mat-label for="secretName">Secret Name</mat-label>
                  <input matInput type="text" id="secretName" value="testcertv1">
                </mat-form-field>
              </div>
              <div class="col-md-4">
                <mat-form-field appearance="outline" style="width: 100%;">
                  <mat-label for="applicationNames">Application Names</mat-label>
                  <input matInput type="text" id="applicationNames" value="app1, app2, app3">
                </mat-form-field>
              </div>
              <div class="col-md-4">
                <mat-form-field appearance="outline" style="width: 100%;">
                  <mat-label for="password">Password</mat-label>
                  <input matInput type="password" id="password" value="****">
                </mat-form-field>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-4">
                <label for="certificate" class="form-label">Certificate</label>
                <input type="file" class="form-control" id="certificate">
              </div>
              <div class="col-md-4">
                <label for="privateKey" class="form-label">Private Key</label>
                <input type="file" class="form-control" id="privateKey">
              </div>
              <div class="col-md-4">
                <label class="form-label">Select CA Certificate(s)</label>
                <mat-radio-group aria-label="Select an option">
                  <mat-radio-button value="dev" checked>DEV</mat-radio-button>
                  <mat-radio-button value="uat">UAT</mat-radio-button>
                  <mat-radio-button value="prod">PROD</mat-radio-button>
                </mat-radio-group>
              </div>
            </div>

            <button mat-raised-button color="primary" type="submit">Submit</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
